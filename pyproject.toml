[project]
name = "non-decimal-integer-literal-parser"
version = "0.1.1"
description = "Converts C-style hex, binary, and octal literals to Python integers."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
